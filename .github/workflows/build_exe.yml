name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone Windows Executable
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "OmniTool" --add-data "core;core" --add-data "gui;gui" main.py

      - name: Archive build artifacts
        run: |
          Compress-Archive -Path dist\OmniTool -DestinationPath OmniTool-Windows.zip

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniTool-Windows
          path: OmniTool-Windows.zip
